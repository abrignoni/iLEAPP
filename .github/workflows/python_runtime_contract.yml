name: Python Runtime Contract

on:
  pull_request:
    paths:
      - '.github/workflows/python_runtime_contract.yml'
      - 'README.md'
      - 'requirements.txt'
      # The job runs the whole admin/test/scripts suite, so trigger on all of it
      - 'admin/test/scripts/**'
      # The suite imports every artifact module, which is the only check that a
      # change parses on the oldest supported Python. Lint runs on one, newer
      # version and cannot see this class of break.
      - 'scripts/**'
      # The entry points are covered by the same suite and are equally able to
      # break on an older Python
      - 'ileapp.py'
      - 'ileappGUI.py'
      # The entry points and scripts/ilapfuncs.py import leapp_functions, so a
      # change there is equally able to break on an older Python
      - 'leapp_functions/**'
      # test_packaging_build.py loads packaging/build.py, the entry point and the spec
      - 'packaging/**'

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions README.md tells users to run
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Blob-less fetch; materialize everything except the committed test
          # fixtures under admin/test/cases/data, which no step here reads.
          sparse-checkout: |
            /*
            !/admin/test/cases/data
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run admin compatibility tests
        run: python -m unittest discover -s admin/test/scripts -p 'test_*.py'

  install:
    # README promises these versions. On Windows, x64 and ARM64, they must
    # install with no compiler: only the pure-Python packages that publish no
    # wheels may build from source, so a compiled package without a wheel on
    # PyPI or in whl_files fails here. Windows ARM64 Python starts at 3.11 in
    # setup-python. macOS installs as users do; pyliblzfse has no macOS wheels,
    # so a compiler is needed there on every version.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - { os: windows-11-arm, python-version: '3.11' }
          - { os: windows-11-arm, python-version: '3.12' }
          - { os: windows-11-arm, python-version: '3.13' }
          - { os: windows-11-arm, python-version: '3.14' }
          - { os: windows-11-arm, python-version: '3.15' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/admin/test/cases/data
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies from wheels (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: --no-binary=biplist,pgpy,nska-deserialize -r requirements.txt

      - name: Install runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install -r requirements.txt

      - name: Import the compiled dependencies
        run: |
          python -c "import liblzfse, astc_decomp_faster, ahocorasick, numpy, pandas, PIL, pillow_heif, Crypto, mmh3; print('ok')"
