name: Test builds

# Builds iLEAPP with packaging/build.py on every platform and architecture it ships for,
# runs what came out, builds each platform's installer, and uploads the lot. Nothing here
# is a release; release.yml runs the same steps when a version tag is pushed. It exists so
# every platform's build is produced and actually executed, without anyone owning the
# hardware.
#
# The smoke test is the point, not decoration. The frozen builds shipped a startup crash
# for a long time (missing google.protobuf, PIL, leapp_functions) precisely because
# nothing ever ran a built binary. `build.py smoke` runs the executable the ways a user
# does: --version, a run over an empty extraction, a run over the NTFS raw fixture, the
# bundled Unified Log parser, and the window's --selfcheck, which counts the artifacts
# the build loaded against the source.
#
# Advisory rather than required, so a paths filter is fine here. A logic change inside an
# existing module almost never breaks a build; packaging and dependency changes are where
# the breaks come from, and the weekly build of main covers the rest.

on:
  workflow_dispatch:
  # Monday 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'packaging/**'
      - 'requirements.txt'
      - 'admin/scripts/fetch_unifiedlog_iterator.py'
      - '.github/workflows/test_builds.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `os` is the runner; `name` is what the job and its artifact are called, since
        # a runner label such as macos-latest does not say which machine it is.
        include:
          - os: windows-latest
            name: windows-x64
          # The Unified Log parser is the x64 build under Windows 11's emulation here,
          # since Mandiant publishes no windows-arm64 parser, so passing on this leg also
          # proves the path an ARM examiner relies on.
          - os: windows-11-arm
            name: windows-11-arm
          - os: macos-latest
            name: macos-apple_silicon
          # Intel Macs. GitHub drops x86_64 macOS when macos-15-intel retires in 2027.
          - os: macos-15-intel
            name: macos-15-intel
          # 22.04 rather than 24.04: a build runs only on the glibc it was made against or
          # a newer one, and 22.04's 2.35 still covers the SIFT workstation and the LTS
          # releases examiners keep.
          - os: ubuntu-22.04
            name: ubuntu-22.04-x64
          - os: ubuntu-22.04-arm
            name: ubuntu-22.04-arm
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Latest supported Python. astc-decomp-faster >= 1.1.5 publishes cp314
          # win_amd64 wheels on PyPI, and pyliblzfse cp314 wheels ship in whl_files.
          python-version: '3.14'

      - name: Provide OpenSSL for the cryptography source build (Windows arm64 only)
        # cryptography publishes no win_arm64 wheels at all (49.0.0 checked), so on
        # Windows-on-ARM pip builds it from source: Rust is on the runner already,
        # OpenSSL is not. Everything else heavy (numpy, pandas, pillow, mmh3,
        # pillow_heif) ships cp314 win_arm64 wheels, and pycryptodome covers it with
        # an abi3 wheel - cryptography is the one wall.
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $vcpkg = 'vcpkg'
          if (-not (Get-Command vcpkg -ErrorAction SilentlyContinue)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg-local
            & C:\vcpkg-local\bootstrap-vcpkg.bat
            $vcpkg = 'C:\vcpkg-local\vcpkg.exe'
          }
          & $vcpkg install openssl:arm64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $roots = @('C:\vcpkg-local', $env:VCPKG_INSTALLATION_ROOT) | Where-Object { $_ }
          $installed = $roots | ForEach-Object { Join-Path $_ 'installed\arm64-windows-static-md' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installed) { Write-Error 'vcpkg OpenSSL install dir not found'; exit 1 }
          "OPENSSL_DIR=$installed" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Linux, the window's toolkit and a display for its self-check
        # The window imports tkinter, and PyInstaller needs that import to succeed at
        # analysis time; the hard check turns a missing toolkit into a readable failure.
        # xvfb gives the --selfcheck a display.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libtcl8.6 libtk8.6 xvfb
          python -c "import tkinter" || { echo "tkinter unavailable in this Python"; exit 1; }

      - name: Fetch the Unified Log parser (digest-verified)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install certifi
          python admin/scripts/fetch_unifiedlog_iterator.py

      - name: Smoke test the parser binary
        # --help because unifiedlog_iterator exits non-zero on --version alone in some
        # releases. On Linux x64 this is the musl build, statically linked so it runs on
        # any distribution; arm64 gets the gnu build, since no musl one is published.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin/unifiedlog_iterator.exe --help; else bin/unifiedlog_iterator --help; fi

      - name: Check the third-party notices cover the fetched parser
        # The binary statically links Rust crates under their own licenses, and the
        # committed notices file carries their texts. This compares the crate versions
        # whose source paths the binary embeds with that file, without network access.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PARSER=bin/unifiedlog_iterator.exe; else PARSER=bin/unifiedlog_iterator; fi
          python admin/scripts/make_unifiedlog_notices.py --verify "$PARSER"

      - name: Phase 1, the ileapp executable
        shell: bash
        run: python packaging/build.py exe

      - name: Smoke test the build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python packaging/build.py smoke
          else
            python packaging/build.py smoke
          fi

      - name: Phase 2, the installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup --no-progress -y
          python packaging/build.py installer
          ls -l dist/iLEAPP-Setup-*.exe

      - name: Phase 2, the disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/build.py installer
          ls -l dist/iLEAPP-*.dmg

      # build.py runs the finished AppImage once and requires it to report the version.
      - name: Phase 2, the AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python packaging/build.py installer
          ls -l dist/iLEAPP-*.AppImage

      # Windows and Linux ship the one-folder build as well as their installer.
      - name: Upload the build (Windows, Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ileapp-${{ matrix.name }}-test
          path: |
            dist/iLEAPP/
            dist/iLEAPP-Setup-*.exe
            dist/iLEAPP-*.AppImage
          retention-days: 14
          if-no-files-found: error

      # macOS ships only the disk image. dist/iLEAPP/ is there too, the one-folder build
      # PyInstaller copies into the .app, but nothing ships or tests it. The .app goes up
      # inside its .dmg: an artifact zip keeps neither the bundle's symlinks nor its
      # signature.
      - name: Upload the build (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ileapp-${{ matrix.name }}-test
          path: dist/iLEAPP-*.dmg
          retention-days: 14
          if-no-files-found: error
