name: PR review pilot tests

on:
  pull_request:
    paths:
      - '.github/workflows/review_pilot_tests.yml'
      - 'admin/scripts/check_pr_test_data.py'
      - 'admin/scripts/review_ileapp_pr.py'
      - 'admin/scripts/mac_review_worker.py'
      - 'admin/scripts/install_mac_review.py'
      - 'admin/test/scripts/test_mac_review_worker.py'
      - 'admin/test/scripts/test_check_pr_test_data.py'
      - 'admin/test/scripts/test_review_ileapp_pr.py'

permissions:
  contents: read

jobs:
  routing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Exercise fixture classification and delivery with synthetic PRs
        run: |
          python admin/test/scripts/test_check_pr_test_data.py
          python admin/test/scripts/test_review_ileapp_pr.py
          python admin/test/scripts/test_mac_review_worker.py
